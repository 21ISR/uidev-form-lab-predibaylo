<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="reset.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div>
        <section>
            <h1>Student Registration</h1>
            <h2>Create your student account</h2>
        </section>
        <section>
            <h3>Full name</h3>
            <input type="text" placeholder="Enter your full name">
            <h3>Email Address</h3>
            <input type="email" placeholder="Enter your email">
            <h3>Student ID</h3>
            <input type="text" placeholder="Enter your student ID">
            <h3>Select Program</h3>
            <select name="Choose your program" id="">
                <option value="">— Choose your program —</option>
                <option value="CS">Computer Science</option>
                <option value="ENG">Engineering</option>
                <option value="BUS">Business</option>
                <option value="A&H">Arts & Humanities</option>
                <option value="SCI">Science</option>
            </select>
            <h3>Password</h3>
            <input type="password" placeholder="Create a password">
            <h3>Confirm password</h3>
            <input type="password" autocomplete="off" placeholder="Confrim your password">
            <span>
                <input type="checkbox" name="" id="">
                <p>I agree to the Terms of Service and Privacy Police</p>
            </span>
        </section>
        <section>
            <Button>Create Account</Button>
            <p>Already have an account?<a href="index.html">Log in</a></p>
        </section>
    </div>
</body>
</html>
