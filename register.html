<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration</title>
    <link rel="stylesheet" href="reset.css">
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="div_register">
        <form action="/api/login" method="post">
            <section type="title" class="reg_top_sec">
                <h1>Student Registration</h1>
                <h2>Create your student account</h2>
            </section>
            <section class="reg_main_sec">
                <fieldset>
                    <label for="fullname">Full name</label>
                    <input type="text" id="full_name" name="full_name" placeholder="Enter your full name">
                </fieldset>
                <fieldset>
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" placeholder="Enter your email">
                </fieldset>
                <fieldset>
                    <label for="student-id">Student ID</label>
                    <input type="text" id="student-id" name="student-id" placeholder="Enter your student ID">
                </fieldset>
                <fieldset>
                    <label for="program">Select Program</label>
                    <select name="program" id="program">
                        <option value=" ">Choose your program</option>
                        <option value="CS">Computer Science</option>
                        <option value="ENG">Engineering</option>
                        <option value="BUS">Business</option>
                        <option value="A&H">Arts & Humanities</option>
                        <option value="SCI">Science</option>
                    </select>
                </fieldset>
                <fieldset>
                <label for="password">Password</label>
                <input type="password" name="password" id="password" placeholder="Enter your password" Create a password">
                </fieldset>
                <fieldset>
                    <label for="password">Confirm password</label>
                    <input type="password" id="password" name="password autocomplete=" off"
                        placeholder="Confrim your password">
                </fieldset>
                <span>
                    <label for="checkbox"></label>
                    <input type="checkbox" name="terms" id="terms">
                    <p>I agree to the Terms of Service and Privacy Police</p>
                </span>
                <Button type="submit">Create Account</Button>
                <p>Already have an account? <a href="index.html">Log in</a></p>
            </section>
        </form>
    </div>
</body>

</html>
