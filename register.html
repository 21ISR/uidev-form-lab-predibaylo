<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration</title>
    <link rel="stylesheet" href="reset.css">
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">
</head>

<body>
    <div class="div_register">
        <section class="reg_top_sec">
            <h1 class="h1_reg">Student Registration</h1>
            <h2 class="h2_reg">Create your student account</h2>
        </section>
        <form action="/api/login" method="post">
            <section class="reg_main_sec">
                <fieldset>
                    <label for="fullname">Full name</label>
                    <input type="text" id="full_name" name="full_name" placeholder="Enter your full name">
                </fieldset>
                <fieldset>
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" placeholder="Enter your email">
                </fieldset>
                <fieldset>
                    <label for="student-id">Student ID</label>
                    <input type="text" id="student-id" name="student-id" placeholder="Enter your student ID">
                </fieldset>
                <fieldset>
                    <label for="program">Select Program</label>
                    <select name="program" id="program">
                        <option value=" ">Choose your program</option>
                        <option value="CS">Computer Science</option>
                        <option value="ENG">Engineering</option>
                        <option value="BUS">Business</option>
                        <option value="A&H">Arts & Humanities</option>
                        <option value="SCI">Science</option>
                    </select>
                </fieldset>
                <fieldset>
                    <label for="password">Password</label>
                    <input type="password" name="password" id="password" placeholder="Create your password">
                </fieldset>
                <fieldset>
                    <label for="password">Confirm password</label>
                    <input type="password" id="password" name="password autocomplete=" off"
                        placeholder="Confrim your password">
                </fieldset>
                <span>
                    <label for="checkbox"></label>
                    <input type="checkbox" name="terms" id="terms">
                    <p> I agree to the Terms of Service and Privacy Police</p>
                </span>
                <Button type="submit">Create Account</Button>
                <fieldset type="center_content">
                    <p>Already have an account? <a href="index.html">Log in</a></p>
                </fieldset>
            </section>
        </form>
    </div>
</body>

</html>
